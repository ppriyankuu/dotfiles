# ── PREFIX & NAVIGATION (unchanged) ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on
set -g set-clipboard on
set -sg escape-time 0

bind r source-file ~/.tmux.conf \; display "Reloaded!"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# ── GRUVBOX SOFT DARK PALETTE ──
# bg0=#282828  bg1=#3c3836  fg=#ebdbb2
# red=#cc241d  green=#98971a  yellow=#d79921
# blue=#458588 purple=#b16286 gray=#928374

# Base status bar (bg0 background, fg text)
set -g status-style bg=#282828,fg=#ebdbb2

# Active window (bg1 highlight, bg0 text for contrast)
setw -g window-status-current-style fg=#282828,bg=#98971a

# Inactive windows (gray on bg0)
setw -g window-status-style fg=#928374,bg=#282828

# Left: session name in green accent
set -g status-left "#[fg=#98971a]#S "

# Right: date in yellow, time in blue
set -g status-right "#[fg=#d79921]%Y-%m-%d #[fg=#458588]%H:%M "

# Copy mode selection highlight (green bg, dark text)
set -g mode-style bg=#98971a,fg=#282828

# Pane borders
set -g pane-border-style fg=#3c3836
set -g pane-active-border-style fg=#98971a

# ── CLIPBOARD (unchanged) ──
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ── TRUECOLOR PASSTHROUGH (CRITICAL) ──
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
